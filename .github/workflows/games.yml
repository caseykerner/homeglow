name: Game schedules

# Builds games.json (the next two weeks of games, in HomeGlow's team names)
# twice a day and publishes it with the website. The sports data key lives in
# the repository secret BALLDONTLIE_KEY, never in the app or these files.
on:
  schedule:
    - cron: "17 9,21 * * *"   # about 4 AM and 4 PM Central
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build games.json
        run: node scripts/build-games.mjs
        env:
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}
      - name: Publish
        run: |
          git config user.name "HomeGlow schedules"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.json
          git diff --cached --quiet || git commit -m "Update game schedules"
          git push
